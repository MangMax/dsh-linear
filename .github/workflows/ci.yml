# CI (plan §56): install → vp check → vp test → vp pack → package smoke →
# Harness install smoke, across the Node / OS compatibility matrix, plus the
# optional real-Linear E2E (plan §54) on main / scheduled runs.
#
# Compatibility matrix (plan §56, §62): Node 20 / 22 / 24 on macOS + Linux.
# Windows is not covered while Harness itself does not officially target it
# (plan §56). Quality gates for PR merge: vp check + vp test + vp pack +
# Harness smoke (plan §57).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly real-Linear E2E against the dedicated test workspace (§54).
    - cron: "0 3 * * 1"

jobs:
  quality:
    name: quality (node ${{ matrix.node }} · ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm exec vp check
      - name: Test
        run: pnpm exec vp test
      - name: Pack
        run: pnpm exec vp pack

  harness-smoke:
    name: package + harness install smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack
        run: pnpm exec vp pack
      - name: Build tarball
        # Rebuild the publishable tgz without re-running the gates (already
        # green in `quality`); the smoke script consumes the newest tgz.
        run: pnpm pack --config.ignore-scripts=true
      - name: Harness install smoke (plan §53.4)
        run: bash scripts/ci/harness-install-smoke.sh

  real-e2e:
    name: real Linear E2E (plan §54)
    if: ${{ secrets.LINEAR_TEST_API_KEY != '' }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Real Linear E2E (dedicated test workspace)
        run: pnpm exec vp test tests/e2e
        env:
          LINEAR_TEST_API_KEY: ${{ secrets.LINEAR_TEST_API_KEY }}
